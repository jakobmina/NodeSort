name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match NODESORT_VERSION_STRING
        run: |
          header=$(sed -n 's/^#define NODESORT_VERSION_STRING "\(.*\)"/\1/p' include/nodesort/nodesort.h)
          if [ "v$header" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match header version $header" >&2
            exit 1
          fi

  package:
    needs: check-version
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build, test and package
        shell: bash
        run: |
          prefix_args=""
          if [ "$RUNNER_OS" = "Linux" ]; then prefix_args="-DCMAKE_INSTALL_PREFIX=/usr"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON $prefix_args
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
          cd build && cpack -C Release
      - name: Source archives
        if: runner.os == 'Linux'
        run: cd build && cpack --config CPackSourceConfig.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
            build/*.zip
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* --title "nodesort $GITHUB_REF_NAME" --notes "${notes:-Release $GITHUB_REF_NAME}"
